name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0" # Sundays 03:00 UTC: weekly fuzz run
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # The version (and rustfmt/clippy) come from rust-toolchain.toml.
      - run: rustup toolchain install && rustc --version
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: make web
      - run: make check
        env:
          # PE samples are cross-built with clang + rust-lld; fail instead of skipping.
          DRISHTI_REQUIRE_PE: "1"
      # Browser E2E on macOS, where the symbolised corpus sample builds.
      - if: matrix.os == 'macos-latest'
        run: make corpus && (cd web && npx playwright install chromium) && make e2e
      # Linux-only failures can't be reproduced on the dev Mac: keep the
      # corpus sample exactly as the tests build it (our own benign source).
      - if: failure() && matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p linux-samples
          for o in O0 O2; do
            clang -g -$o -o linux-samples/netclient-$o corpus/src/netclient.c
            cp linux-samples/netclient-$o linux-samples/netclient-$o.stripped
            strip linux-samples/netclient-$o.stripped
          done
          clang --version > linux-samples/clang-version.txt
      - if: failure() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with: { name: linux-samples, path: linux-samples }
      - if: failure() && matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with: { name: e2e-traces, path: web/test-results, if-no-files-found: ignore }
  fuzz:
    # Weekly 1 h per target (ROADMAP A6); manual runs via "Run workflow".
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo +nightly install cargo-fuzz --locked
      - run: make fuzz-all
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: fuzz-artifacts, path: fuzz/artifacts }
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - run: cargo install cargo-audit && cargo audit
      - run: cd web && npm ci && npm audit --omit=dev
