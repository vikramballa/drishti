[package]
name = "drishti-cli"
description = "Drishti command-line interface"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
drishti-disasm = { version = "0.1.0", path = "../drishti-disasm" }
drishti-ir = { version = "0.1.0", path = "../drishti-ir" }
drishti-loader = { version = "0.1.0", path = "../drishti-loader" }
drishti-model = { version = "0.1.0", path = "../drishti-model" }
drishti-server = { version = "0.1.0", path = "../drishti-server" }
serde_json.workspace = true

[[bin]]
name = "drishti"
path = "src/main.rs"
