[package]
name = "drishti-disasm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
capstone = { version = "0.14.0", default-features = false, features = ["full", "std", "arch_arm", "arch_arm64", "arch_mips", "arch_riscv", "arch_powerpc", "arch_x86"] }
drishti-ir = { version = "0.1.0", path = "../drishti-ir" }
drishti-loader = { version = "0.1.0", path = "../drishti-loader" }
drishti-model = { version = "0.1.0", path = "../drishti-model" }
regex = "1.13.1"
iced-x86 = { version = "1.22.0", default-features = false, features = ["std", "decoder", "intel", "instr_info"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
