[workspace]
resolver = "2"
members = ["crates/*"]
# Everything except `drishti-difftest`, which links Unicorn (GPL-2.0) for
# differential tests only: `make difftest`. Never a dependency of the binary.
default-members = [
    "crates/drishti-cli",
    "crates/drishti-disasm",
    "crates/drishti-ir",
    "crates/drishti-loader",
    "crates/drishti-model",
    "crates/drishti-server",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.100"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
